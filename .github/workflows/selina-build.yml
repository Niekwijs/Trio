name: Simplified Trio Build (No Fastlane/Sync)
run-name: Build Trio - ${{ github.ref_name }}
on:
  workflow_dispatch:

env:  
  TARGET_BRANCH: ${{ github.ref_name }}
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"
  DERIVED_DATA_PATH: build-output/DerivedData

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app/Contents/Developer

      - name: Checkout Repo and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      # --- Customization and Dependency Setup ---
      - name: Apply Trio Patches
        run: |
          echo "Applying patches..."
          if $(ls ./patches/* &> /dev/null); then
            git apply ./patches/* --allow-empty -v --whitespace=fix
          fi

      - name: Install Ruby Gems (Bundler)
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Clean DerivedData
        run: rm -rf $DERIVED_DATA_PATH

      # --- Core Build Process ---
      - name: Xcode Build, Archive, and IPA Export (Unsigned)
        run: |
          mkdir -p build-output

          echo "Starting Xcode Archive..."
          xcodebuild clean archive \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -archivePath "build-output/Trio.xcarchive" \
            -derivedDataPath $DERIVED_DATA_PATH \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_PREPROCESSOR_DEFINITIONS="DEBUG=0"

          # Create ExportOptions.plist using echo
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ExportOptions.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ExportOptions.plist
          echo '<plist version="1.0">' >> ExportOptions.plist
          echo '<dict>' >> ExportOptions.plist
          echo '    <key>method</key>' >> ExportOptions.plist
          echo '    <string>ad-hoc</string>' >> ExportOptions.plist
          echo '    <key>signingStyle</key>' >> ExportOptions.plist
          echo '    <string>manual</string>' >> ExportOptions.plist
          echo '    <key>stripSwiftSymbols</key>' >> ExportOptions.plist
          echo '    <true/>' >> ExportOptions.plist
          echo '</dict>' >> ExportOptions.plist
          echo '</plist>' >> ExportOptions.plist

          echo "Starting IPA Export..."
          xcodebuild -exportArchive \
            -archivePath "build-output/Trio.xcarchive" \
            -exportPath "build-output/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration

          IPA_NAME=$(find build-output/ipa -name "*.ipa")
          if [ -z "$IPA_NAME" ]; then
            echo "ERROR: IPA file not found."
            exit 1
          fi
          mv "$IPA_NAME" "build-output/Trio.ipa"
          echo "✅ Unsigned IPA created at build-output/Trio.ipa"

      # --- Artifact Upload ---
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-ipa-and-logs
          path: |
            build-output/Trio.ipa
            build-output/Trio.xcarchive