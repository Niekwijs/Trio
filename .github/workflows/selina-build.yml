name: CI/CD Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Your existing variables moved to the environment context for a GitHub Action job
env:
  LANG: "en_US.UTF-8"
  LC_ALL: "en_US.UTF-8"

jobs:
  build_ipa: # This is your job's ID
    name: Build IPA
    runs-on: macos-latest
    
    # 'stage' isn't a top-level key in GitHub Actions; it's implicit 
    # that steps run sequentially within a job.
    
    steps: # Jobs in GitHub Actions have 'steps', not 'script' directly at the job level
      - uses: actions/checkout@v4 # Essential step to get your code
      
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app/Contents/Developer
        # Note: You need to ensure this path is correct for the runner's available Xcode versions.

      - name: Install dependencies
        run: bundle install

      - name: Build IPA (unsigned)
        run: | # Use a multi-line pipe for complex commands
          bundle exec fastlane gym \
            --scheme "Trio" \
            --workspace "Trio.xcworkspace" \
            --configuration Release \
            --export_method ad-hoc \
            --skip_codesigning true \
            --output_directory build \
            --output_name app.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-ipa
          path: build/app.ipa
          retention-days: 7 # GitHub Actions uses 'retention-days' instead of 'expire_in' for artifacts
          
# The 'artifacts' key is replaced by the 'actions/upload-artifact' step.